# Eclipse Dshbooster dedicated preset. Copy this whole project directory.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.

- id: task-router-bootstrap
  name: ./preset/router-bootstrap.mjs
  config:
    # standard: exact first request = platform shell + str_replace_editor.
    # spec: classified read-first/write-first surface, still hiding management.
    routerMode: 'standard'
    dedicatedPreset: true
    # off | ambiguous-only | always. Uses the current session route with
    # reasoning disabled; no second API key is needed.
    llmClassifier: 'off'
    llmTimeoutMs: 1200
    llmMinConfidence: 0.7
    # mode-boost-derived guidance and native task governance are the active
    # policy sources. Vendored J-Space material is reference-only and is not
    # loaded by the default runtime.
    # Optional. Schema-v2 state defaults to .router-state in the workspace.
    # stateDirectory: '/path/to/durable/router-state'

# Optional latest Odyssey package integration. The package must be installed in
# the target DSH profile separately; this row only mounts its agent-plane
# adapter. Host-plane console/rebrand/restart/vision plugins stay opt-in.
- id: odyssey-adapter
  name: '@odyssey/dsh-adapter'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
